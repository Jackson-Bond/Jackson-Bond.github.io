<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jackson Bond | Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Desktop -->
    <div id="desktop">
        <div id="desktop-icons"></div>
    </div>

    <!-- Window layer -->
    <div id="windows-container"></div>

    <!-- Start Menu -->
    <div id="start-menu">
        <div class="start-sidebar">
            <span class="start-sidebar-text">Jackson Bond</span>
        </div>
        <div class="start-items">
            <div class="start-item" id="start-about-btn">
                <span class="start-item-icon">&#128100;</span>
                <span>About Me</span>
            </div>
            <div class="start-separator"></div>
            <div class="start-item" id="start-github-btn">
                <span class="start-item-icon">&#128279;</span>
                <span>GitHub Profile</span>
            </div>
        </div>
    </div>

    <!-- Taskbar -->
    <div id="taskbar">
        <button id="start-btn">
            <span class="start-logo">&#9670;</span>
            <strong>Start</strong>
        </button>
        <div class="taskbar-sep"></div>
        <div id="taskbar-buttons"></div>
        <div class="taskbar-sep"></div>
        <div id="taskbar-tray">
            <div id="clock"></div>
        </div>
    </div>

    <!-- scripts -->
    <script src="script.js"></script>
</body>
</html>
